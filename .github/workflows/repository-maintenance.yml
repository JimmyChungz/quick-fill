name: Repository maintenance
on:
  push:
    branches: [main]
permissions: {}
jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Remove superseded workflow records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for run_id in 40837921047 40898403060 40899101110; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$run_id"
          done
