<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>快填安全解锁</title><link rel="stylesheet" href="unlock.css"></head><body>
<header><strong>快填 · 解锁密码库</strong><button id="close" type="button" aria-label="关闭解锁框">×</button></header>
<p>在这里输入主密码即可继续填充，无需打开管理页。输入由快填扩展处理，不会交给当前网站。</p>
<form id="unlock-form"><label for="password">主密码</label><div class="master-password-row"><input id="password" type="password" autocomplete="current-password" minlength="8" maxlength="1024" required autofocus><button id="password-reveal" class="password-eye" type="button" aria-controls="password" aria-label="显示主密码" aria-pressed="false"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><g class="eye-open"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></g><g class="eye-closed"><path d="M3 9c2 4 5 6 9 6s7-2 9-6M5 12l-2 3m6-1-1 4m7-4 1 4m3-6 2 3"/></g></svg></button></div><button id="unlock" type="submit">解锁并继续</button></form>
<p id="status" role="status">正在确认解锁请求…</p><script src="unlock.js"></script></body></html>
